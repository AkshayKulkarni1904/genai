[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-genai"
version = "1.0.0"
description = "Enterprise GenAI Practical Engineering Repository: Advanced RAG, Knowledge Graphs, GraphRAG, LangChain LCEL, LangGraph StateGraph, Multi-Agent Systems, and Guardrails."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Akshay Kulkarni", email = "akshay@example.com" }
]
keywords = [
    "genai",
    "rag",
    "advanced-rag",
    "knowledge-graphs",
    "graphrag",
    "langchain",
    "langgraph",
    "multi-agent",
    "guardrails",
    "evaluation",
    "llm-as-a-judge"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Application Frameworks"
]
dependencies = [
    "pydantic>=2.0.0",
    "networkx>=3.0",
    "rich>=13.0.0",
    "tabulate>=0.9.0",
    "typing_extensions>=4.5.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=23.0.0",
    "ruff>=0.1.0"
]

[project.urls]
Homepage = "https://github.com/AkshayKulkarni1904/genai"
Repository = "https://github.com/AkshayKulkarni1904/genai.git"
Issues = "https://github.com/AkshayKulkarni1904/genai/issues"

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
